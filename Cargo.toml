[package]
name = "token-watcher"
version = "0.1.0"
edition = "2021"
description = "Antigravity and Claude usage reader in Rust for GNOME Shell extension"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.104"
chrono-tz = "0.10.4"

[dev-dependencies]
tempfile = "3.27.0"
