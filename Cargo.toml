[package]
name = "token-watcher"
version = "0.1.0"
edition = "2021"
description = "Antigravity token and quota reader in Rust for GNOME Shell extension"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.104"
